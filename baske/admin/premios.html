<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin premios · FRAN-BASKET</title>
    <link rel="stylesheet" href="../css/baske.css">
    <script src="/global.js"></script>
</head>
<body class="bk">
    <main class="bk-main">
        <a class="bk-volver" href="index.html">Administración</a>
        <h1 class="bk-titulo">Premios</h1>

        <div class="bk-tabs" role="tablist">
            <button type="button" role="tab" aria-selected="true" data-tab="ganados">Premios ganados</button>
            <button type="button" role="tab" aria-selected="false" data-tab="catalogo">Catálogo de premios</button>
        </div>

        <section id="sec-ganados">
            <div class="bk-barra"><button type="button" class="bk-btn bk-btn--azul" id="nuevo-ganador">+ Asignar premio</button></div>
            <div id="ganados"><div class="bk-cargando">Cargando…</div></div>
        </section>

        <section id="sec-catalogo" hidden>
            <div class="bk-barra"><button type="button" class="bk-btn bk-btn--azul" id="nuevo-premio">+ Nuevo premio</button></div>
            <div id="catalogo"></div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="/fiesta-config.js"></script>
    <script src="../js/baske.js"></script>
    <script src="../js/admin-comun.js"></script>
    <script src="../js/admin-premios.js"></script>
</body>
</html>
