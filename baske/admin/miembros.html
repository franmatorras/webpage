<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin miembros · FRAN-BASKET</title>
    <link rel="stylesheet" href="../css/baske.css">
    <script src="/global.js"></script>
</head>
<body class="bk">
    <main class="bk-main">
        <a class="bk-volver" href="index.html">Administración</a>
        <h1 class="bk-titulo">Miembros y usuarios</h1>

        <div class="bk-tabs" role="tablist">
            <button type="button" role="tab" aria-selected="true" data-tab="miembros">Miembros</button>
            <button type="button" role="tab" aria-selected="false" data-tab="junta">Junta directiva</button>
        </div>

        <section id="sec-miembros">
            <div class="bk-barra">
                <button type="button" class="bk-btn bk-btn--azul" id="nuevo-miembro">+ Nuevo miembro</button>
                <input type="search" id="buscar" placeholder="Buscar…" aria-label="Buscar miembro">
                <label class="bk-check"><input type="checkbox" id="ocultar-difuntos"> Ocultar difuntos</label>
            </div>
            <div id="miembros"><div class="bk-cargando">Cargando…</div></div>
        </section>

        <section id="sec-junta" hidden>
            <div class="bk-barra"><button type="button" class="bk-btn bk-btn--azul" id="nuevo-cargo">+ Nuevo cargo</button></div>
            <p class="bk-nota" style="margin-bottom:0.75rem">Un cargo por persona a la vez, salvo Maestro de la Moneda, que se suma a otro cargo durante todo su periodo. Al dejar la junta: termina primero el de Maestro de la Moneda.</p>
            <div id="junta"></div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="/fiesta-config.js"></script>
    <script src="../js/baske.js"></script>
    <script src="../js/admin-comun.js"></script>
    <script src="../js/admin-miembros.js"></script>
</body>
</html>
