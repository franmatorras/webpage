<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Entrar · FRAN-BASKET</title>
    <link rel="stylesheet" href="css/baske.css">
    <script src="/global.js"></script>
</head>
<body class="bk">
    <main class="bk-login-main">
        <div class="bk-card bk-login">
            <h1 class="bk-login-logo">FRAN-<span>BASKET</span></h1>
            <p class="bk-nota">Web interna del equipo. Solo para miembros.</p>

            <form id="form-login" novalidate>
                <div class="bk-campo">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
                </div>

                <div id="paso-password" hidden>
                    <div class="bk-campo">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" autocomplete="current-password">
                    </div>
                </div>

                <div id="paso-nueva" hidden>
                    <p class="bk-mensaje bk-mensaje--ok" style="margin: 0 0 0.9rem">Es tu primera vez: elige una contraseña (mínimo 8 caracteres).</p>
                    <div class="bk-campo">
                        <label for="nueva">Nueva contraseña</label>
                        <input type="password" id="nueva" autocomplete="new-password" minlength="8">
                    </div>
                    <div class="bk-campo">
                        <label for="repetir">Repite la contraseña</label>
                        <input type="password" id="repetir" autocomplete="new-password" minlength="8">
                    </div>
                </div>

                <button type="submit" class="bk-btn bk-btn--grande" id="boton">Continuar</button>
                <div id="mensaje" class="bk-mensaje" role="alert"></div>
                <a href="#" id="cambiar" class="bk-login-volver" hidden>Cambiar de usuario</a>
            </form>

            <a class="bk-login-volver" href="../index.html">← Volver a fran.matorras.com</a>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="/fiesta-config.js"></script>
    <script src="js/baske.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
